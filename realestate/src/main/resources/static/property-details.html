<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Property Details | James Estate</title>
    <link rel="stylesheet" href="https://unpkg.com/cesium@1.125/Build/Cesium/Widgets/widgets.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background: #f3f4f6;
            color: #1a1a1a;
        }

        /* Navbar */
        .navbar {
            background: #fff;
            border-bottom: 1px solid #e5e7eb;
            padding: 0 30px;
            height: 65px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 22px;
            font-weight: 700;
            color: #c41e3a;
            text-decoration: none;
        }

        .logo span {
            color: #1a1a1a;
        }

        .nav-links a {
            text-decoration: none;
            color: #374151;
            font-size: 14px;
            font-weight: 500;
            margin-left: 24px;
        }

        /* Content */
        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #c41e3a;
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
        }

        .details-grid {
            display: grid;
            grid-template-columns: 1.4fr 1fr;
            gap: 30px;
        }

        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            padding: 30px;
        }

        .gallery {
            margin-bottom: 18px;
        }

        .gallery .main-photo,
        .gallery .placeholder {
            width: 100%;
            height: 340px;
            object-fit: cover;
            border-radius: 12px;
            background: #e5e7eb;
        }

        .gallery .placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #6b7280;
        }

        .thumbs {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            overflow-x: auto;
        }

        .thumbs img {
            width: 76px;
            height: 58px;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid transparent;
        }

        .thumbs img.active {
            border-color: #c41e3a;
        }

        .title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .price {
            font-size: 26px;
            font-weight: 700;
            color: #c41e3a;
            margin-bottom: 15px;
        }

        .badges {
            display: flex;
            gap: 8px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .badge {
            font-size: 12px;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 500;
        }

        .sale { background: #fee2e2; color: #b91c1c; }
        .rent { background: #fef3c7; color: #b45309; }
        .hotel { background: #f3e8ff; color: #7e22ce; }
        .verified { background: #dcfce7; color: #15803d; }
        .not-verified { background: #fee2e2; color: #b91c1c; }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            margin: 25px 0 12px;
            color: #111;
        }

        .description {
            color: #4b5563;
            line-height: 1.7;
            font-size: 15px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 10px;
        }

        .info-item {
            background: #f9fafb;
            padding: 14px;
            border-radius: 10px;
        }

        .info-item label {
            display: block;
            font-size: 12px;
            color: #6b7280;
            margin-bottom: 4px;
        }

        .info-item span {
            font-size: 15px;
            font-weight: 600;
            color: #111;
        }

        /* Map */
        #map {
            height: 420px;
            border-radius: 12px;
            margin-top: 15px;
            overflow: hidden;
        }

        #map .cesium-viewer,
        #map .cesium-viewer-cesiumWidgetContainer,
        #map .cesium-widget {
            width: 100%;
            height: 100%;
        }

        .contact-box {
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 12px;
            padding: 20px;
            margin-top: 25px;
            text-align: center;
        }

        .contact-box p {
            font-size: 14px;
            color: #7f1d1d;
            margin-bottom: 8px;
        }

        .contact-box strong {
            color: #111;
            font-size: 16px;
        }

        .contact-btn {
            display: inline-block;
            background: #c41e3a;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            text-decoration: none;
            margin-top: 8px;
        }

        .doc-card {
            background: #f9fafb;
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 10px;
        }

        .doc-card h4 {
            font-size: 14px;
            margin-bottom: 4px;
        }

        .doc-card p {
            font-size: 13px;
            color: #4b5563;
            margin-top: 4px;
        }

        .doc-card a {
            color: #c41e3a;
            font-size: 13px;
            font-weight: 600;
        }

        .loading {
            text-align: center;
            padding: 80px 20px;
            color: #6b7280;
        }

        @media (max-width: 800px) {
            .details-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
<link rel="stylesheet" href="market.css">
</head>
<body class="market">

<nav class="navbar">
    <a href="index.html" class="logo">James <span>Estate</span></a>
    <div class="nav-links">
        <a href="properties.html">Browse Properties</a>
        <a href="login.html">Agent Login</a>
    </div>
</nav>

<div class="container">
    <a href="properties.html" class="back-link">← Back to Properties</a>

    <div id="content">
        <div class="loading">Loading property details...</div>
    </div>
</div>

<script>window.CESIUM_BASE_URL = "https://unpkg.com/cesium@1.125/Build/Cesium/";</script>
<script src="https://unpkg.com/cesium@1.125/Build/Cesium/Cesium.js"></script>
<script src="earth-view.js"></script>
<script>
    // Get property ID from URL
    const urlParams = new URLSearchParams(window.location.search);
    const propertyId = urlParams.get('id');

    if (!propertyId) {
        document.getElementById("content").innerHTML = "<p style='color:red;'>Property not found.</p>";
    } else {
        loadProperty(propertyId);
    }

    function esc(value) {
        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;");
    }

    async function loadProperty(id) {
        try {
            const res = await fetch("http://localhost:8080/api/public/properties/" + id);
            if (!res.ok) {
                document.getElementById("content").innerHTML = "<p style='color:red;'>Property not found.</p>";
                return;
            }
            renderProperty(await res.json());
            loadDocuments(id);
        } catch (err) {
            document.getElementById("content").innerHTML = "<p style='color:red;'>Failed to load property.</p>";
        }
    }

    async function loadDocuments(id) {
        const box = document.getElementById("documents");
        if (!box) return;
        try {
            const res = await fetch("http://localhost:8080/api/documents/property/" + id);
            const docs = await res.json();
            if (!docs.length) {
                box.innerHTML = "<p class='description'>No title documents have been added yet.</p>";
                return;
            }
            box.innerHTML = docs.map(doc => `
                <div class="doc-card">
                    <h4>${esc(doc.documentType)} <span class="badge ${doc.status === "VERIFIED" ? "verified" : "not-verified"}">${esc(doc.status || "PENDING")}</span></h4>
                    <p>${doc.documentNumber ? "Number: " + esc(doc.documentNumber) : "No document number"}</p>
                    ${doc.fileUrl ? `<p><a href="${esc(doc.fileUrl)}" target="_blank" rel="noopener">Open file</a></p>` : ""}
                </div>
            `).join("");
        } catch (err) {
            box.innerHTML = "<p class='description'>Documents could not be loaded.</p>";
        }
    }

    function renderProperty(p) {
        const priceLabel = p.priceType === 'MONTHLY' ? '/month' :
            p.priceType === 'NIGHTLY' ? '/night' : '';

        const listingBadge = p.listingType === 'SALE' ? '<span class="badge sale">For Sale</span>' :
            p.listingType === 'RENT' ? '<span class="badge rent">For Rent</span>' :
                p.listingType === 'HOTEL' ? '<span class="badge hotel">Hotel</span>' : '';

        const verifiedBadge = p.titleVerified
            ? '<span class="badge verified">Title Verified</span>'
            : '<span class="badge not-verified">Not Verified</span>';

        const agent = p.agent || {};
        const phoneLink = agent.phone
            ? `<a class="contact-btn" href="tel:${esc(agent.phone)}">Call ${esc(agent.phone)}</a>`
            : "";
        const emailLine = agent.email
            ? `<p><a href="mailto:${esc(agent.email)}">${esc(agent.email)}</a></p>`
            : "";
        const images = Array.isArray(p.images) ? p.images : [];
        const gallery = images.length
            ? `<div class="gallery">
                    <img id="mainPhoto" class="main-photo" src="${esc(images[0].url)}" alt="${esc(p.title)}">
                    <div class="thumbs">
                        ${images.map((img, index) => `<img src="${esc(img.url)}" alt="" class="${index === 0 ? "active" : ""}" onclick="document.getElementById('mainPhoto').src=this.src; this.parentElement.querySelectorAll('img').forEach(item => item.classList.remove('active')); this.classList.add('active');">`).join("")}
                    </div>
               </div>`
            : `<div class="gallery"><div class="placeholder">No photos yet</div></div>`;

        const contactHtml = agent.fullName
            ? `<p>Listed by</p><p><strong>${esc(agent.fullName)}</strong></p>${emailLine}<p>${agent.phone ? "" : "No phone number listed."}</p>${phoneLink}`
            : `<p>Agent contact is not available for this listing.</p>`;

        document.getElementById("content").innerHTML = `
                <div class="details-grid">
                    <!-- Left Column -->
                    <div class="card">
                        ${gallery}
                        <h1 class="title">${esc(p.title)}</h1>
                        <div class="price">₦${Number(p.price).toLocaleString()}${priceLabel}</div>

                        <div class="badges">
                            ${listingBadge}
                            ${verifiedBadge}
                        </div>

                        <h3 class="section-title">Description</h3>
                        <p class="description">${esc(p.description || "No description provided.").replace(/\n/g, "<br>")}</p>

                        <h3 class="section-title">Property Information</h3>
                        <div class="info-grid">
                            <div class="info-item">
                                <label>Property Type</label>
                                <span>${esc(p.propertyType || "N/A")}</span>
                            </div>
                            <div class="info-item">
                                <label>Status</label>
                                <span>${esc(p.status || "N/A")}</span>
                            </div>
                            <div class="info-item">
                                <label>Bedrooms</label>
                                <span>${esc(p.bedrooms || "N/A")}</span>
                            </div>
                            <div class="info-item">
                                <label>Bathrooms</label>
                                <span>${esc(p.bathrooms || "N/A")}</span>
                            </div>
                            <div class="info-item">
                                <label>City</label>
                                <span>${esc(p.city || "N/A")}</span>
                            </div>
                            <div class="info-item">
                                <label>State</label>
                                <span>${esc(p.state || "N/A")}</span>
                            </div>
                        </div>

                        <h3 class="section-title">Address</h3>
                        <p class="description">${esc(p.address || "Address not available")}${p.city ? ", " + esc(p.city) : ""}</p>

                        <h3 class="section-title">Title Documents</h3>
                        <div id="documents"><p class="description">Loading documents...</p></div>
                    </div>

                    <!-- Right Column -->
                    <div>
                        <div class="card">
                            <h3 class="section-title" style="margin-top:0;">Location</h3>
                            <div id="map"></div>

                            <div class="contact-box">
                                ${contactHtml}
                            </div>
                        </div>
                    </div>
                </div>
            `;

        // Initialize map if coordinates exist
        if (p.latitude && p.longitude) {
            const detailViewer = new Cesium.Viewer("map", {
                imageryProvider: false,
                baseLayerPicker: false,
                geocoder: false,
                animation: false,
                timeline: false,
                homeButton: false,
                sceneModePicker: false,
                navigationHelpButton: false,
                fullscreenButton: false,
                infoBox: false,
                terrainProvider: new Cesium.EllipsoidTerrainProvider()
            });
            addRealWorldLayers(detailViewer);
            detailViewer.entities.add({
                position: Cesium.Cartesian3.fromDegrees(p.longitude, p.latitude),
                point: {
                    pixelSize: 16,
                    color: Cesium.Color.fromCssColorString("#c41e3a"),
                    outlineColor: Cesium.Color.WHITE,
                    outlineWidth: 2,
                    disableDepthTestDistance: Number.POSITIVE_INFINITY
                },
                label: {
                    text: p.title || "Property",
                    font: "14px sans-serif",
                    pixelOffset: new Cesium.Cartesian2(0, -24),
                    fillColor: Cesium.Color.WHITE,
                    outlineColor: Cesium.Color.BLACK,
                    outlineWidth: 3,
                    style: Cesium.LabelStyle.FILL_AND_OUTLINE,
                    disableDepthTestDistance: Number.POSITIVE_INFINITY
                }
            });
            lookAtGround(detailViewer, p.longitude, p.latitude, 340);
            detailViewer.resize();
        } else {
            document.getElementById("map").innerHTML =
                "<p style='padding:40px; text-align:center; color:#6b7280;'>Location not available</p>";
        }
    }
</script>
</body>
</html>
