spring.config.import=optional:file:./secrets.properties

spring.datasource.url=jdbc:postgresql://localhost:5432/Jamesestate_db
spring.datasource.username=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Email Configuration (Gmail)
spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=jamesestate.ng@gmail.com
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

app.public-url=http://localhost:8080

spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=40MB

app.storage.endpoint=http://127.0.0.1:9000
app.storage.region=us-east-1
app.storage.bucket=jamesestate
app.storage.public-url=http://localhost:8080/media
app.storage.access-key=jamesestate

spring.cache.type=caffeine
spring.cache.cache-names=publicListings,publicProperty
spring.cache.caffeine.spec=maximumSize=2000,expireAfterWrite=60s